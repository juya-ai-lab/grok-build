# Formatting gate: fast, single-platform check that catches rustfmt drift
# before release. Deliberately no cargo check/clippy here — those are heavy
# and are run manually when needed.

name: CI - Format Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/format-check.yml
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/format-check.yml
  workflow_dispatch:

concurrency:
  # Keep only the latest run per branch/PR; a new push cancels the stale one.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Verify Code Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore Rust Toolchain Cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.1.0
        id: cache-toolchain
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve Toolchain from rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          data = tomllib.loads(Path("rust-toolchain.toml").read_text(encoding="utf-8"))
          print(data["toolchain"]["channel"])
          PY
          )
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Verify Code Formatting
        shell: bash
        run: cargo fmt --all --check

      - name: Save Rust Toolchain Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.1.0
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
