# Formatting gate: fast, single-platform check that catches rustfmt drift
# before release. Deliberately no cargo check/clippy here — those are heavy
# and are run manually when needed.

name: CI Format Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Verify code formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.92.0"
          components: rustfmt

      - name: Check formatting (cargo fmt --all --check)
        shell: bash
        run: cargo fmt --all --check
