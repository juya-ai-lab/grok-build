# Build release-dist binaries for all supported platforms and attach them
# to a GitHub Release when a version tag is pushed.
#
# Flow:
#   prepare (resolve version, create tag if missing) → build × 6
#   (parallel, fail-fast: false); each platform publishes its own binary
#   and per-platform checksum as soon as it finishes, without waiting for
#   the slower matrix legs.
#
# A platform that finishes the full build/package/publish path releases its
# assets even if other matrix legs fail. Lint gates belong on PR CI, not here.
#
# Asset naming matches the official install/update convention used by
# install.sh and xai-grok-update (gh-release path):
#   grok-{version}-{os}-{arch}[.exe]
#   os   ∈ macos | linux | windows
#   arch ∈ x86_64 | aarch64
#
# Trigger:
#   1) git tag v0.2.116 && git push origin v0.2.116  (automatic)
#   2) Actions tab -> Release -> Run workflow -> optionally enter a tag -> run
#      (web-only path; no git client needed. Leave the tag empty to derive it
#      from the version crate manifest (VERSION_CRATE_MANIFEST). The tag is
#      created up front (when missing) at the built commit; an existing tag
#      must point at the built commit or the run fails. GITHUB_TOKEN-created
#      refs do not re-trigger the push workflow.)

name: CI - Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.2.116). Leave empty to use the version from the version crate."
        required: false
        type: string


concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto
  # Primary crate / binary produced by this workflow (single source of truth).
  RELEASE_PACKAGE: xai-grok-pager-bin
  RELEASE_BIN: xai-grok-pager
  # Crate manifest carrying the lockstepped CLI version. The manual web-only
  # release path derives the tag from it when the tag input is empty; update
  # this path if upstream relocates the version crate.
  VERSION_CRATE_MANIFEST: crates/codegen/xai-grok-version/Cargo.toml
  CARGO_CACHE_SHARED_KEY: release-shared

jobs:
  prepare:
    name: Prepare Release (Resolve Version, Create Tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve Version
        id: ver
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${TAG_INPUT}"
            if [ -z "$tag" ]; then
              version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$VERSION_CRATE_MANIFEST" | head -1)"
              if [ -z "$version" ]; then
                echo "Could not read version from $VERSION_CRATE_MANIFEST; enter a tag in the workflow inputs." >&2
                exit 1
              fi
              tag="v${version}"
              echo "Manual run: derived tag from version crate = $tag"
            else
              echo "Manual run: tag input = $tag"
            fi
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
            echo "Invalid version tag: $tag (expected vX.Y.Z or vX.Y.Z-suffix)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Tag if Missing
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag-push run: tag ${TAG} already exists by definition."
            exit 0
          fi
          # Peel annotated tags to their commit (^{}); lightweight tags have
          # no peeled ref, so fall back to the plain ref which is the commit sha.
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}' | tail -1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}' | tail -1)"
          fi
          if [ -n "$existing" ]; then
            head="$(git rev-parse HEAD)"
            if [ "$existing" = "$head" ]; then
              echo "Tag ${TAG} already exists at the built commit ${head}; reusing it."
              exit 0
            fi
            echo "Tag ${TAG} already exists at ${existing}, but this run builds ${head}. Refusing to attach new binaries to a tag that points elsewhere; pick a new version tag or delete the old one first." >&2
            exit 1
          fi
          git tag "${TAG}" 2>/dev/null || git tag -f "${TAG}"
          git push origin "${TAG}"
          echo "Created and pushed tag ${TAG} at $(git rev-parse HEAD)."

  build:
    name: Build Release Binaries (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 120
    permissions:
      # Each matrix leg publishes its own assets to the GitHub Release.
      contents: write
      attestations: write
      id-token: write
    env:
      # sccache env vars are set in the Configure step for non-Windows legs
      # (Windows compiles directly; its sccache server crashes on the large
      # crates). Per-target keys avoid matrix-leg write races; the repo-wide
      # GHA cache is 10 GB, so stale entries are evicted LRU.
      # 1024 MiB per target keeps the six sccache buckets within that budget.
      CARGO_CACHE_SHARED_KEY: release-shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            can_run: true

          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
            can_run: true

          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            exe_suffix: ""
            can_run: true

          # Cross-compile Intel macOS from Apple Silicon (no Rosetta needed to link).
          - platform: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            exe_suffix: ""
            can_run: false

          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"
            can_run: true

          - platform: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe_suffix: ".exe"
            can_run: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Protoc
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.1.0
        with:
          path: ${{ runner.temp }}/protoc-*
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/protoc') }}

      - name: Setup Protoc and Rust
        uses: ./.github/actions/setup-build
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        # sccache's server has been observed crashing mid-compile on the
        # xai-grok-shell crate on Windows runners (connection reset); those
        # platforms compile directly instead.
        if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure Sccache Env
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_CACHE_SIZE=1024" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_CACHE_TO=sccache-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_CACHE_FROM=sccache-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}
          # Only cache registry/git — full target/ restores spike disk on LTO builds.
          cache-targets: false
          cache-on-failure: true
          shared-key: ${{ env.CARGO_CACHE_SHARED_KEY }}

      - name: Build Release Binary
        shell: bash
        env:
          GROK_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          df -h . || df -h || true

          # Portable Linux aarch64: override monorepo Graviton-oriented flags.
          # .cargo/config.toml sets target-cpu=neoverse-v2 and jemalloc lg-page=16
          # (64 KiB pages) for internal fleets — wrong for general distribution.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=generic -C force-unwind-tables=yes"
            export AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE="12"
          fi

          cargo build \
            -p "${RELEASE_PACKAGE}" \
            --profile release-dist \
            --features release-dist \
            --target "${{ matrix.target }}"

          echo "--- disk after build ---"
          df -h . || df -h || true
          du -sh target 2>/dev/null || true

      - name: Show sccache Statistics
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SCCACHE_PATH:-}" ]; then
            "${SCCACHE_PATH}" --show-stats
          else
            sccache --show-stats 2>/dev/null || echo "sccache not available"
          fi

      - name: Package Artifact
        id: pkg
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.exe_suffix }}
        run: |
          set -euo pipefail

          src="target/${TARGET}/release-dist/${RELEASE_BIN}${EXE_SUFFIX}"
          if [ ! -f "$src" ]; then
            echo "Missing build output: $src" >&2
            ls -la "target/${TARGET}/release-dist/" || true
            exit 1
          fi

          # Strip debug info for distribution size (profile keeps symbols intentionally).
          case "${{ runner.os }}" in
            Linux)
              strip --strip-unneeded "$src" || strip "$src" || true
              ;;
            macOS)
              strip -x "$src" || strip "$src" || true
              ;;
            Windows)
              ;;
          esac

          asset="grok-${VERSION}-${PLATFORM}${EXE_SUFFIX}"
          mkdir -p dist
          cp "$src" "dist/${asset}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "dist/${asset}"
          fi

          ls -lh "dist/${asset}"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "asset_path=dist/${asset}" >> "$GITHUB_OUTPUT"

      - name: Smoke Test (--version)
        if: matrix.can_run
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BIN_PATH: ${{ steps.pkg.outputs.asset_path }}
        run: |
          set -euo pipefail
          bin="${BIN_PATH}"
          out="$("$bin" --version </dev/null 2>&1)" || {
            echo "Binary failed to execute: $bin" >&2
            exit 1
          }
          echo "$out"
          if ! grep -Fq "$VERSION" <<<"$out"; then
            echo "Warning: --version output did not contain '$VERSION'" >&2
            echo "Continuing — binary still packaged." >&2
          fi

      - name: Compute Checksum
        shell: bash
        env:
          ASSET_PATH: ${{ steps.pkg.outputs.asset_path }}
        run: |
          set -euo pipefail
          cd "$(dirname "$ASSET_PATH")"
          asset="$(basename "$ASSET_PATH")"
          sha256sum "$asset" | tee "$asset.sha256"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v5.1.0
        with:
          subject-path: dist/grok-*

      - name: Drop Cargo Target Directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -d target ]; then
            du -sh target || true
            rm -rf target
            echo "Removed target/"
          fi
          echo "--- disk after dropping target/ ---"
          df -h . || df -h || true
          ls -lh dist/ || true

      - name: Publish to GitHub Release
        # First leg to finish creates the release; later legs update it
        # in place, so fast platforms publish without waiting for slow ones.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          # Manual runs create the tag up front at the built commit; ignored
          # when the tag already exists (tag-push runs).
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          update_release: true
          # Re-running / partial matrices should attach newly built assets.
          fail_on_unmatched_files: false
          files: |
            ${{ steps.pkg.outputs.asset_path }}
            ${{ steps.pkg.outputs.asset_path }}.sha256
