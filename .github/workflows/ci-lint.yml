# Lint the workflow files themselves (actionlint, zizmor) and scan the
# dependency tree (cargo-deny). Cheap enough to run on every push/PR.

name: CI - Workflow and Dependency Checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/dependabot.yml
      - .github/zizmor.yml
      - deny.toml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/dependabot.yml
      - .github/zizmor.yml
      - deny.toml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  # Keep only the latest run per branch/PR; a new push cancels the stale one.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Workflows and Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore Pip Cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ runner.os }}

      - name: Restore Cargo-Deny Data Cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-deny
        with:
          path: |
            ~/.cargo/advisory-dbs
            ~/.cargo/registry
            ~/.cargo/git
          key: lint-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lint-cargo-${{ runner.os }}-

      - name: Restore Actionlint Cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-actionlint
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-${{ runner.os }}-1.7.12

      - name: Install actionlint
        shell: bash
        run: |
          # taiki-e/install-action does not support actionlint (not on
          # crates.io / its release manifests), so fetch the official
          # release and verify its checksum. Bump the pinned version here.
          if [ ! -x "$HOME/.local/bin/actionlint" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o /tmp/actionlint_1.7.12_linux_amd64.tar.gz \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            curl -fsSL -o /tmp/actionlint.checksums \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
            cd /tmp
            grep "actionlint_1.7.12_linux_amd64.tar.gz" actionlint.checksums | sha256sum -c -
            tar -xzf actionlint_1.7.12_linux_amd64.tar.gz -C "$HOME/.local/bin" actionlint
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          actionlint --version

      - name: Run actionlint
        shell: bash
        run: actionlint

      - name: Install zizmor
        shell: bash
        run: python3 -m pip install --break-system-packages --quiet zizmor

      - name: Run zizmor
        shell: bash
        run: zizmor .github/workflows

      - name: Install cargo-deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        shell: bash
        run: cargo deny check

      - name: Save Pip Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-pip.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ runner.os }}

      - name: Save Cargo-Deny Data Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-deny.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/advisory-dbs
            ~/.cargo/registry
            ~/.cargo/git
          key: lint-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Save Actionlint Cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache-actionlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-${{ runner.os }}-1.7.12
