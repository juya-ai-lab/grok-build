# zizmor configuration: documented exceptions for the release pipeline.
rules:
  # The prepare job intentionally checks out with persisted credentials so it
  # can push the release tag with GITHUB_TOKEN; the build job also uses the
  # default checkout across the matrix.
  artipacked:
    ignore:
      - release.yml
  # Release caches (sccache/cargo registry) are only used by tag-push and
  # workflow_dispatch runs with write access; no PR-triggered workflow shares
  # these cache keys.
  cache-poisoning:
    ignore:
      - release.yml
  # softprops/action-gh-release is kept because the publish job updates
  # existing releases and handles partial matrix uploads.
  superfluous-actions:
    ignore:
      - release.yml
  # npm publishing authenticates with an automation token (NPM_TOKEN) stored
  # as a repository secret with publish-only access to the @juya-ai-lab scope.
  # npm trusted publishing (OIDC) can be adopted later once the npm org is
  # configured as a trusted publisher for this repository.
  use-trusted-publishing:
    ignore:
      - dist-npm.yml
